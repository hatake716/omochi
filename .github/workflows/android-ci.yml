name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omochi-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android SDK 36 is installed
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Test, lint, and build
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:verifyEmbeddedRuntime \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify distribution APK
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libproot.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libproot-loader.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libandroid-shmem.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libtalloc.so'
          unzip -l "$APK" | grep 'assets/legal/NOTICE.txt'
          unzip -l "$APK" | grep 'assets/legal/licenses/GPL-2.0.txt'
          unzip -l "$APK" | grep 'assets/legal/licenses/LGPL-3.0.txt'
          unzip -l "$APK" | grep 'assets/legal/sources/proot-v5.1.107.92.zip'
          unzip -l "$APK" | grep 'assets/legal/SOURCE-AND-LICENSE-MANIFEST.sha256'
          cp "$APK" app/build/outputs/apk/debug/Omochi-v0.3.0-debug.apk
          sha256sum app/build/outputs/apk/debug/Omochi-v0.3.0-debug.apk \
            > app/build/outputs/apk/debug/Omochi-v0.3.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omochi-v0.3.0-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/Omochi-v0.3.0-debug.apk
            app/build/outputs/apk/debug/Omochi-v0.3.0-debug.apk.sha256
